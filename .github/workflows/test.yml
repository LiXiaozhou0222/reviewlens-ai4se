name: test

on:
  push:
  pull_request:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    env:
      APP_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install make
        run: sudo apt-get update && sudo apt-get install --yes make
      - name: Install dependencies
        run: make install
      - name: Run Mock-backed tests
        run: make test
